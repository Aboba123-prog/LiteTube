<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiteTube</title>
<link rel="stylesheet" href="style.css">
<!--[if lt IE 9]>
<script>
document.createElement('header');document.createElement('nav');
document.createElement('main');document.createElement('section');
</script>
<![endif]-->
</head>
<body>

<header class="topbar">
  <a href="#/home" class="logo">Lite<span>Tube</span></a>

  <form id="searchForm" class="search" action="#" onsubmit="return false;">
    <input id="searchInput" type="text" placeholder="Search videos" autocomplete="off">
    <button id="searchBtn" type="submit">Search</button>
  </form>

  <nav class="tabs">
    <a href="#/home" id="tab-home">Home</a>
    <a href="#/shorts" id="tab-shorts">Shorts</a>
  </nav>
</header>

<main id="app">

  <section id="view-home" class="view">
    <h2 class="heading">Recommended</h2>
    <div id="homeFeed" class="feed"></div>
  </section>

  <section id="view-search" class="view">
    <h2 class="heading" id="searchHeading">Search results</h2>
    <div id="searchFeed" class="feed"></div>
    <p id="searchEmpty" class="empty">No videos found. Try another search.</p>
  </section>

  <section id="view-shorts" class="view">
    <div class="shorts-wrap">
      <div id="shortFrame" class="short-frame"></div>
      <div class="short-controls">
        <button id="shortPrev" type="button">&#9650; Prev</button>
        <span id="shortCount">1 / 1</span>
        <button id="shortNext" type="button">Next &#9660;</button>
      </div>
      <p class="hint">Tap the video to play or pause. Swipe up or down, or use the arrow keys.</p>
    </div>
  </section>

</main>

<div id="player" class="player">
  <div class="player-box">
    <button id="playerClose" type="button" class="player-close">Close &times;</button>
    <div id="playerHolder" class="player-holder"></div>
    <h3 id="playerTitle" class="player-title"></h3>
    <p id="playerMeta" class="meta"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
