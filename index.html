<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteTube</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrap">
        <div class="header">
            <div class="logo" onclick="resetApp()" title="Сбросить и обновить">Lite<span>Tube</span></div>
            <div class="search-form">
                <input type="text" id="q" placeholder="Поиск по словам или ссылка/ID..."
                    onkeydown="if(event.keyCode===13) startSearch()">
                <button id="btnSearch" onclick="startSearch()">Найти</button>
            </div>
            <div class="quick-tags">
                <span onclick="quickSearch('музыка 80х')">Музыка</span>
                <span onclick="quickSearch('новости технологий')">Технологии</span>
                <span onclick="quickSearch('игровые обзоры')">Игры</span>
                <span onclick="quickSearch('космос hd')">Космос</span>
            </div>
        </div>

        <div class="player-box" id="playerBox">
            <div class="player-bar">
                <span id="nowPlaying">Воспроизведение</span>
                <button class="close-btn" onclick="closePlayer()">Закрыть</button>
            </div>
            <div class="iframe-wrap">
                <iframe id="player" src="" allowfullscreen></iframe>
            </div>
        </div>

        <div class="status" id="status">Введите поисковый запрос или ссылку на видео</div>
        <div id="results"></div>
    </div>

    <script src="app.js"></script>
</body>

</html>
