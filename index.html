<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteTube</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">LiteTube</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Поиск видео...">
            <button id="searchBtn">Найти</button>
        </div>
        <nav class="nav-links">
            <button id="homeTab" class="active">Главная</button>
            <button id="shortsTab">Shorts</button>
        </nav>
    </header>

    <main id="appContent">
        <section id="playerContainer" class="hidden">
            <div class="video-wrapper">
                <video id="mainVideo" controls playsinline webkit-playsinline>
                    <track id="captionTrack" kind="captions" srclang="ru" label="Русский">
                </video>
            </div>
            <div class="video-details">
                <h2 id="videoTitle"></h2>
                <div class="controls-bar">
                    <label for="qualitySelect">Качество: </label>
                    <select id="qualitySelect"></select>
                </div>
            </div>
        </section>

        <section id="gridContainer" class="video-grid"></section>

        <section id="shortsContainer" class="hidden"></section>
    </main>

    <script src="script.js"></script>
</body>
</html>
